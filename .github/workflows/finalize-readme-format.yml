name: Finalize README formatting

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-readme:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Restore README trailing blank line
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          data = path.read_bytes()
          before = len(data)
          print("README bytes before:", before)
          print("README tail before:", repr(data[-20:]))

          if not data.endswith(b"\n\n"):
              if data.endswith(b"\n"):
                  data += b"\n"
              else:
                  data += b"\n\n"
              path.write_bytes(data)

          data = path.read_bytes()
          print("README bytes after:", len(data))
          print("README tail after:", repr(data[-20:]))
          PY

      - name: Commit formatting and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git rm -f .github/workflows/finalize-readme-format.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs: preserve README trailing blank line"
            git push origin HEAD:dev
          fi
