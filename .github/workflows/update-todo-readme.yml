name: Update README TODO list

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-todos:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Ensure main ref is available
        run: git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update Complete TODO List
        run: python .github/scripts/update_readme_todos.py

      - name: Commit and push README update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No staged changes."
          else
            git commit -m "docs: update Complete TODO List for dev changes"
            git push origin HEAD:dev
          fi
